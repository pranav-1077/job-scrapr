[project]
name = "job-scrapr"
version = "0.1.0"
description = "Scrapes job boards at quant/trading firms and emails new postings daily"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "lxml>=4.9.0",
    "playwright>=1.40.0",
    "playwright-stealth>=2.0.0",
    "curl-cffi>=0.6.0",
]
